<style>
:root{
  --bg:#131118; --surface:#1c1924; --line:#342e42;
  --text:#f0eaf5; --soft:#d8d0e2; --muted:#a59cb5;
  --accent:#e9b872; --accent-dim:rgba(233,184,114,.42);
  --font:'Merienda'; --scale:.95;
  --text-font:'EB Garamond'; --text-size:20.5px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font),'Segoe Script','Apple Chancery',cursive;
  font-size:calc(17px*var(--scale)); line-height:1.7;
  -webkit-font-smoothing:antialiased; overflow-wrap:break-word;
}
a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-dim)}
a:hover{border-bottom-color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- layout: picture pinned on top, only The Latests scrolls ---------- */
.page{max-width:696px; margin:0 auto; padding:0 28px 32px}
.profile{
  position:sticky; top:0; z-index:5; background:var(--bg);   /* stays put while The Latests scrolls */
  padding-top:30px;
}
.profile::after{
  content:''; position:absolute; left:0; right:0; top:100%; height:20px;
  background:linear-gradient(var(--bg),transparent); pointer-events:none;
}
.page.unpinned .profile{position:static}      /* screen too short to pin: everything scrolls */
.page.unpinned .profile::after{display:none}

/* ---------- picture and name ---------- */
.me{text-align:center}
.photo{
  display:block; margin:0 auto; width:200px; height:200px; object-fit:cover;
  border-radius:26px; border:3px solid var(--accent); padding:4px; background:var(--surface);
}
div.photo{display:grid; place-items:center; font-size:68px; color:var(--accent)}
.name{font-size:1.55em; line-height:1.2; font-weight:700; margin:14px 0 2px}
.tagline{color:var(--accent); font-size:.8em; letter-spacing:.03em; margin:0}

/* ---------- links and summary (phones and narrow windows: in a column under the picture) ---------- */
.links{list-style:none; display:flex; flex-wrap:wrap; justify-content:center; gap:0 20px; margin:12px 0 0; padding:0; font-size:.84em}
.links li{display:flex; align-items:center; gap:8px; line-height:1.75}
.links li::before{content:''; flex:none; width:6px; height:6px; border-radius:50%; background:var(--accent)}
.links a{color:var(--text); border-bottom-color:transparent}
.links a:hover{color:var(--accent); border-bottom-color:var(--accent-dim)}
.summary{margin-top:10px; text-align:center; font-size:.86em; line-height:1.65; color:var(--soft)}

/* ---------- wide screens: links pinned at the left edge, summary pinned at the right edge ---------- */
@media (min-width:1180px){
  /* --side is the margin between the screen edge and the links / summary.
     It grows with the screen so they sit closer to the middle; raise the 608px to pull them in further. */
  :root{--side:max(36px, calc(50vw - 608px))}
  .page,.foot{max-width:min(696px, calc(100vw - 592px))}   /* keep clear of the two side columns */
  .links,.summary{
    position:fixed; top:50%; transform:translateY(-50%); z-index:6;
    width:220px; max-height:calc(100vh - 64px); overflow-y:auto; scrollbar-width:none; margin:0;
  }
  .links::-webkit-scrollbar,.summary::-webkit-scrollbar{display:none}
  .links{left:var(--side); display:block; font-size:.92em}
  .links li{gap:10px; line-height:1.9}
  .summary{right:var(--side); text-align:left; font-size:.9em; line-height:1.75}
}

/* ---------- the latests (under the picture) ---------- */
h2{font-size:1.3em; font-weight:700; color:var(--accent); text-align:center; margin:20px 0 8px}
.rule{height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.latest{padding-top:26px}
.item{margin:0 0 26px}
.item .date{color:var(--muted); font-size:.78em; font-style:italic}
.item p{margin:3px 0 0; font-family:var(--text-font),Georgia,'Times New Roman',serif; font-size:var(--text-size); line-height:1.55}
.foot{max-width:696px; margin:0 auto; padding:0 28px 28px; text-align:right; font-size:.7em}
.foot a{color:var(--muted); border-bottom-color:transparent}
.foot a:hover{color:var(--accent)}
@media (max-width:780px){
  .page{padding:0 18px 24px} .foot{padding:0 18px 24px}
  .profile{padding-top:22px}
  .photo{width:150px; height:150px; border-radius:22px}
  div.photo{font-size:52px}
  h2{margin-top:16px}
}

/* ---------- editor (only visible in edit mode) ---------- */
#editor{
  position:fixed; top:0; right:0; bottom:0; width:min(440px,100vw); z-index:20;
  display:flex; flex-direction:column; background:#0d0c11; border-left:1px solid var(--line);
  box-shadow:-24px 0 60px rgba(0,0,0,.5);
  font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#e9e5ef;
}
#editor[hidden],#edit-pill[hidden]{display:none}
#editor button,#editor input,#editor textarea,#editor select,#edit-pill{font:inherit; color:inherit}
.ed-head,.ed-foot{padding:14px 16px; flex:none}
.ed-head{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line)}
.ed-head span{display:flex; gap:6px}
.ed-body{flex:1; overflow-y:auto; padding:4px 16px 20px}
.ed-body h3{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:20px 0 10px}
.ed-foot{border-top:1px solid var(--line); background:#121017}
.ed-foot .btns{display:flex; gap:8px}
.ed-foot p{margin:10px 0 0; font-size:12.5px; color:var(--muted)}
#ed-status{color:var(--accent)}
#editor label.f{display:block; margin-bottom:10px}
#editor label.f>span{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
#editor input[type=text],#editor textarea,#editor select{
  width:100%; background:#1a1822; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
}
#editor textarea{resize:vertical; min-height:64px}
#editor button,#edit-pill{
  background:#221f2c; border:1px solid var(--line); border-radius:8px; padding:7px 11px; cursor:pointer;
}
#editor button:hover,#edit-pill:hover{border-color:var(--accent)}
#editor button.primary{background:var(--accent); border-color:var(--accent); color:#1b1408; font-weight:600; flex:1}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.row{display:grid; gap:6px; padding:10px; margin-bottom:8px; background:#15131c; border:1px solid var(--line); border-radius:10px}
.row.link{grid-template-columns:110px minmax(0,1fr)}
.row .rb{grid-column:1/-1; display:flex; gap:6px; justify-content:flex-end}
.row .rb button{padding:3px 9px; font-size:13px}
.add{width:100%; margin-bottom:10px; border-style:dashed !important}
.hint{font-size:12.5px; color:var(--muted); margin:-2px 0 10px}
#edit-pill{position:fixed; right:18px; bottom:18px; z-index:20; color:#1b1408; background:var(--accent); border-color:var(--accent); font:600 14px system-ui,sans-serif; padding:10px 16px; border-radius:999px}
</style>
</head>
<body>
<div id="app"></div>
<aside id="editor" aria-label="Page editor" hidden></aside>
<button id="edit-pill" type="button" hidden>Back to editing</button>

<script>
(function(){
  var FONTS = {
    'Merienda':       {q:'Merienda:wght@300..900',       scale:.95},
    'Courgette':      {q:'Courgette',                    scale:1},
    'Kalam':          {q:'Kalam:wght@300;400;700',       scale:1.05},
    'Caveat':         {q:'Caveat:wght@400..700',         scale:1.28},
    'Dancing Script': {q:'Dancing+Script:wght@400..700', scale:1.18}
  };
  // Typeface for the wording of each entry in The Latests: formal, old-book faces.
  var TEXTFONTS = {
    'EB Garamond':        {q:'EB+Garamond:ital,wght@0,400;0,600;1,400',        scale:1.08},
    'IM Fell English':    {q:'IM+Fell+English:ital@0;1',                       scale:1.08},
    'Old Standard TT':    {q:'Old+Standard+TT:ital,wght@0,400;0,700;1,400',    scale:1},
    'Cormorant Garamond': {q:'Cormorant+Garamond:ital,wght@0,500;0,700;1,500', scale:1.16},
    'Special Elite':      {q:'Special+Elite',                                  scale:.9},
    'Same as the rest':   {q:null,                                             scale:1}
  };
  function textFont(){ return TEXTFONTS[data.textFont] ? data.textFont : 'EB Garamond'; }
  var app = document.getElementById('app');
  var ed = document.getElementById('editor');
  var pill = document.getElementById('edit-pill');
  var editing = false, minimized = false, data;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function safeUrl(u){
    u = String(u || '').trim();
    if(!u) return '#';
    if(/^\s*(javascript|data|vbscript):/i.test(u)) return '#';
    if(/^[^\s@:\/]+@[^\s@]+\.[^\s@]+$/.test(u)) return 'mailto:' + u;   // bare email address
    return u;
  }
  function linkAttrs(u){
    return /^https?:/i.test(u) ? ' target="_blank" rel="noopener"' : '';
  }
  // escaped text + [words](url) links + *italics* + line breaks
  function inline(s){
    return esc(s)
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, t, u){
        u = safeUrl(u); return '<a href="' + u + '"' + linkAttrs(u) + '>' + t + '</a>';
      })
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\n/g, '<br>');
  }

  try { data = JSON.parse(document.getElementById('site-data').textContent); }
  catch(e){
    app.innerHTML = '<p style="padding:40px;max-width:640px">The content block at the top of index.html has a typo, usually a missing comma or quote: ' + esc(e.message) + '</p>';
    return;
  }
  if(!Array.isArray(data.links)) data.links = [];
  if(!Array.isArray(data.latest)) data.latest = [];

  function render(){
    var f = FONTS[data.font] ? data.font : 'Merienda';
    var root = document.documentElement;
    root.style.setProperty('--font', "'" + f + "'");
    root.style.setProperty('--scale', FONTS[f].scale);
    var href = 'https://fonts.googleapis.com/css2?family=' + FONTS[f].q + '&display=swap';
    var fl = document.getElementById('font-link');
    if(fl.getAttribute('href') !== href) fl.setAttribute('href', href);
    var t = textFont(), tq = TEXTFONTS[t].q;
    root.style.setProperty('--text-font', tq ? "'" + t + "'" : "'" + f + "'");
    root.style.setProperty('--text-size', tq ? (19 * TEXTFONTS[t].scale) + 'px' : '1em');
    if(tq){
      var href2 = 'https://fonts.googleapis.com/css2?family=' + tq + '&display=swap';
      var fl2 = document.getElementById('font-link-2');
      if(fl2.getAttribute('href') !== href2) fl2.setAttribute('href', href2);
    }
    document.title = data.name || 'My Website';

    var initials = String(data.name || '?').trim().split(/\s+/).slice(0, 2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
    var photo = data.photo
      ? '<img class="photo" src="' + esc(safeUrlPhoto(data.photo)) + '" alt="Photo of ' + esc(data.name) + '">'
      : '<div class="photo" aria-hidden="true">' + esc(initials) + '</div>';

    app.innerHTML =
      '<div class="page">' +
        '<header class="profile">' +
          '<div class="me">' + photo +
            '<h1 class="name">' + esc(data.name) + '</h1>' +
            (data.tagline ? '<p class="tagline">' + esc(data.tagline) + '</p>' : '') +
          '</div>' +
          '<ul class="links">' + data.links.map(function(l){
            var u = safeUrl(l.url);
            return '<li><a href="' + esc(u) + '"' + linkAttrs(u) + '>' + esc(l.label) + '</a></li>';
          }).join('') + '</ul>' +
          '<div class="summary">' + inline(data.summary || '') + '</div>' +
          '<h2>The Latests:</h2><div class="rule"></div>' +
        '</header>' +
        '<main class="latest">' +
          data.latest.map(function(it){
            return '<article class="item">' + (it.date ? '<div class="date">' + esc(it.date) + '</div>' : '') + '<p>' + inline(it.text) + '</p></article>';
          }).join('') +
        '</main>' +
      '</div>';
    fit();

    var img = app.querySelector('img.photo');
    if(img) img.addEventListener('error', function(){
      var d = document.createElement('div'); d.className = 'photo'; d.textContent = initials; img.replaceWith(d);
    });
  }
  // The top block stays pinned as long as the screen leaves room for the list under it.
  function fit(){
    var page = app.querySelector('.page'); if(!page) return;
    page.classList.remove('unpinned');
    var room = window.innerHeight - page.querySelector('.profile').offsetHeight;
    page.classList.toggle('unpinned', room < Math.max(190, window.innerHeight * .36));
  }
  var resizeTimer;
  window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  function safeUrlPhoto(u){
    u = String(u || '').trim();
    return /^\s*(javascript|vbscript):/i.test(u) ? '' : u;   // data: is fine for an embedded photo
  }

  /* ------------------------------ editor ------------------------------ */
  function rowLink(l, i){
    return '<div class="row link" data-list="links" data-i="' + i + '">' +
      '<input type="text" data-f="label" placeholder="Label" aria-label="Link label" value="' + esc(l.label) + '">' +
      '<input type="text" data-f="url" placeholder="https://… or an email" aria-label="Link address" value="' + esc(l.url) + '">' +
      rowButtons() + '</div>';
  }
  function rowItem(it, i){
    return '<div class="row" data-list="latest" data-i="' + i + '">' +
      '<input type="text" data-f="date" placeholder="e.g. Oct 2026" aria-label="Date" value="' + esc(it.date) + '">' +
      '<textarea data-f="text" rows="2" placeholder="What happened" aria-label="Text">' + esc(it.text) + '</textarea>' +
      rowButtons() + '</div>';
  }
  function rowButtons(){
    return '<div class="rb"><button type="button" data-act="up" title="Move up">↑</button>' +
      '<button type="button" data-act="down" title="Move down">↓</button>' +
      '<button type="button" data-act="del" title="Remove">Remove</button></div>';
  }
  function buildEditor(){
    var body = ed.querySelector('.ed-body'), keep = body ? body.scrollTop : 0;
    var textOpts = Object.keys(TEXTFONTS).map(function(n){
      return '<option' + (n === textFont() ? ' selected' : '') + '>' + n + '</option>';
    }).join('');
    var fontOpts = Object.keys(FONTS).map(function(n){
      return '<option' + (n === (FONTS[data.font] ? data.font : 'Merienda') ? ' selected' : '') + '>' + n + '</option>';
    }).join('');
    ed.innerHTML =
      '<div class="ed-head"><strong>Edit your page</strong><span>' +
        '<button type="button" data-act="min">Hide panel</button><button type="button" data-act="close">Close</button></span></div>' +
      '<div class="ed-body">' +
        '<h3>About you</h3>' +
        '<label class="f"><span>Name</span><input type="text" data-k="name" value="' + esc(data.name) + '"></label>' +
        '<label class="f"><span>Line under your name</span><input type="text" data-k="tagline" value="' + esc(data.tagline) + '"></label>' +
        '<label class="f"><span>Photo (cropped to a square and stored inside the page)</span><input type="file" id="ed-photo" accept="image/*"></label>' +
        (data.photo ? '<button type="button" data-act="nophoto" style="margin:-4px 0 10px">Remove photo</button>' : '') +
        '<label class="f"><span>Summary (shown on the right side of the screen)</span><textarea data-k="summary" rows="5">' + esc(data.summary) + '</textarea></label>' +
        '<div class="two">' +
          '<label class="f"><span>Page font</span><select data-k="font">' + fontOpts + '</select></label>' +
          '<label class="f"><span>Entry text font</span><select data-k="textFont">' + textOpts + '</select></label>' +
        '</div>' +
        '<h3>Links</h3>' + data.links.map(rowLink).join('') +
        '<button type="button" class="add" data-act="add-link">+ Add a link</button>' +
        '<h3>The Latests</h3>' +
        '<p class="hint">Newest first. [words](https://link) makes a link, *words* makes italics.</p>' +
        '<button type="button" class="add" data-act="add-item">+ Add a new entry at the top</button>' +
        data.latest.map(rowItem).join('') +
      '</div>' +
      '<div class="ed-foot"><div class="btns">' +
        '<button type="button" class="primary" data-act="download">Download index.html</button>' +
        '<button type="button" data-act="copy">Copy code</button></div>' +
        '<p><span id="ed-status"></span> Changes show on the page as you type. To publish them, upload the downloaded file to your GitHub repo in place of the old index.html.</p></div>';
    ed.querySelector('.ed-body').scrollTop = keep;
  }
  function status(msg){ var s = document.getElementById('ed-status'); if(s) s.textContent = msg; }

  function syncMode(){
    document.body.classList.toggle('editing', editing);
    if(editing && !ed.innerHTML) buildEditor();
    ed.hidden = !(editing && !minimized);
    pill.hidden = !(editing && minimized);
  }

  ed.addEventListener('input', function(e){
    var t = e.target, row = t.closest('.row');
    if(t.type === 'file') return;
    if(t.dataset.k) data[t.dataset.k] = t.value;
    else if(row && t.dataset.f) data[row.dataset.list][+row.dataset.i][t.dataset.f] = t.value;
    else return;
    status(''); render();
  });
  ed.addEventListener('change', function(e){
    if(e.target.id !== 'ed-photo' || !e.target.files[0]) return;
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var side = Math.min(img.width, img.height), out = Math.min(480, side);
        var c = document.createElement('canvas'); c.width = c.height = out;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) * .3, side, side, 0, 0, out, out);
        data.photo = c.toDataURL('image/jpeg', .86);
        render(); buildEditor(); status('Photo added.');
      };
      img.onerror = function(){ status('That file could not be read as an image.'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(e.target.files[0]);
  });
  ed.addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]'); if(!b) return;
    var act = b.dataset.act, row = b.closest('.row'), list, i;
    if(row){ list = data[row.dataset.list]; i = +row.dataset.i; }
    if(act === 'min'){ minimized = true; syncMode(); return; }
    if(act === 'close'){
      editing = false; minimized = false;
      try { history.replaceState(null, '', location.pathname + location.search); } catch(err){}
      syncMode(); return;
    }
    if(act === 'download'){ download(); return; }
    if(act === 'copy'){ copyCode(); return; }
    if(act === 'nophoto') data.photo = '';
    if(act === 'add-link') data.links.push({label:'New link', url:''});
    if(act === 'add-item') data.latest.unshift({date:'', text:''});
    if(act === 'del') list.splice(i, 1);
    if(act === 'up' && i > 0) list.splice(i - 1, 0, list.splice(i, 1)[0]);
    if(act === 'down' && i < list.length - 1) list.splice(i + 1, 0, list.splice(i, 1)[0]);
    render(); buildEditor();
    if(act === 'add-item'){ var first = ed.querySelector('.row[data-list="latest"] input'); if(first) first.focus(); }
    if(act === 'add-link'){ var rows = ed.querySelectorAll('.row.link input[data-f="label"]'); if(rows.length){ rows[rows.length - 1].focus(); rows[rows.length - 1].select(); } }
  });
  pill.addEventListener('click', function(){ minimized = false; syncMode(); });
  app.addEventListener('click', function(e){
    if(e.target.closest('[data-edit]')){ e.preventDefault(); editing = true; minimized = false; syncMode(); }
  });
  window.addEventListener('hashchange', function(){ if(location.hash === '#edit'){ editing = true; minimized = false; syncMode(); } });

  /* ---- export: the same page with the content block swapped for the new content ---- */
  function buildFile(){
    var json = JSON.stringify(data, null, 2).replace(/</g, '\\u003c');
    var block = /(<script type="application\/json" id="site-data">)[\s\S]*?(<\/script>)/;
    function finish(src){
      if(!src || !block.test(src)){
        var clone = document.documentElement.cloneNode(true);
        clone.querySelector('#app').innerHTML = '';
        var e2 = clone.querySelector('#editor'); e2.innerHTML = ''; e2.setAttribute('hidden', '');
        clone.querySelector('#edit-pill').setAttribute('hidden', '');
        clone.querySelector('body').removeAttribute('class');
        src = '<!doctype html>\n' + clone.outerHTML + '\n';
      }
      var f = FONTS[data.font] ? data.font : 'Merienda';
      return src
        .replace(block, function(m, a, z){ return a + '\n' + json + '\n' + z; })
        .replace(/(<link id="font-link"[^>]*href=")[^"]*(")/, function(m, a, z){
          return a + 'https://fonts.googleapis.com/css2?family=' + FONTS[f].q + '&amp;display=swap' + z;
        })
        .replace(/(<link id="font-link-2"[^>]*href=")[^"]*(")/, function(m, a, z){
          var tq = TEXTFONTS[textFont()].q;
          return tq ? a + 'https://fonts.googleapis.com/css2?family=' + tq + '&amp;display=swap' + z : m;
        });
    }
    return fetch(location.href.split('#')[0], {cache:'no-store'})
      .then(function(r){ return r.ok ? r.text() : null; })
      .catch(function(){ return null; })
      .then(finish);
  }
  function download(){
    buildFile().then(function(src){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([src], {type:'text/html'}));
      a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      status('Downloaded.');
    });
  }
  function copyCode(){
    buildFile().then(function(src){
      return navigator.clipboard.writeText(src).then(function(){ status('Copied. Paste it over index.html on GitHub.'); });
    }).catch(function(){ status('Copying was blocked here. Use Download instead.'); });
  }

  render();
  if(location.hash === '#edit') editing = true;
  syncMode();
})();
</script>
</body>
</html>
